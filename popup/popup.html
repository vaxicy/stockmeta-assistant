<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="extName">StockMeta Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="pp-wrap">
    <div class="pp-header">
      <h1 class="pp-title" data-i18n="extName">StockMeta Assistant</h1>
      <button id="pp-upload" class="pp-icon-btn" data-i18n-title="openUpload" title="Open Adobe Stock Uploads" aria-label="Open Adobe Stock Uploads">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3h7v7"></path>
          <path d="M21 3l-9 9"></path>
          <path d="M19 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"></path>
        </svg>
      </button>
    </div>
    <p id="pp-status" class="pp-status"></p>
    <p class="pp-tip" data-i18n="extDescription">Generate Adobe Stock titles and keywords…</p>
    <button id="pp-options" class="pp-btn" data-i18n="optTitle">Settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
